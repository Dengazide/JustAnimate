name: Render Beer Flood short
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'story/**'
      - 'scripts/**'
      - 'blender/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - '.github/workflows/render.yml'
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Type-check project
        run: npm run typecheck
      - name: Build procedural 3D asset library
        run: python scripts/build_asset_fallback.py
      - name: Generate narration, music and sound effects
        run: npm run audio
      - name: Render 1080x1920 video at 30 fps
        run: npx remotion render src/index.ts BeerFloodShort out/beer-flood.mp4 --codec h264 --crf 17
      - name: Run video quality checks
        run: npm run qa
      - name: Upload video and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beer-flood-video-and-qa
          path: |
            out/beer-flood.mp4
            out/qa/
          if-no-files-found: warn
          retention-days: 14
