name: Render Beer Flood short
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'story/**'
      - 'scripts/**'
      - 'blender/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'requirements.txt'
      - '.github/workflows/render.yml'
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install system tools and 3D software
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng blender
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install all Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify complete toolchain before building
        run: |
          set -euo pipefail
          node --version
          npm --version
          python --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          espeak-ng --version
          blender --background --factory-startup --python-expr "import bpy; print('Blender', bpy.app.version_string)"
          python - <<'PY'
          import numpy, PIL, scipy, trimesh
          print("Python modules verified:", "numpy", numpy.__version__, "Pillow", PIL.__version__, "scipy", scipy.__version__, "trimesh", trimesh.__version__)
          PY
          npm run typecheck
      - name: Build reusable Blender asset library
        run: npm run build:assets
      - name: Generate narration, music and sound effects
        run: npm run audio
      - name: Render 1080x1920 video at 30 fps
        run: npm run render:beer-flood
      - name: Run video quality checks
        run: npm run qa
      - name: Upload video and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beer-flood-video-and-qa
          path: |
            out/beer-flood.mp4
            out/qa/
            public/assets/generated/justanimate-library.glb
            assets/generated/JustAnimate_Library.blend
            public/audio/beer-flood-mix.wav
          if-no-files-found: warn
          retention-days: 14
